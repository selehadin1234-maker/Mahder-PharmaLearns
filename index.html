
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="./manifest.json">
<title>Mahder PharmaLearn</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:linear-gradient(135deg,#064e3b,#0d9488);color:white;padding:28px 18px;text-align:center}
header h1{margin:5px;font-size:26px}
header p{color:#d1fae5}
nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;background:white;padding:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #ddd}
button{background:#087e6b;color:white;border:0;padding:11px 14px;border-radius:9px;cursor:pointer}
button:active{opacity:.7}
main{max-width:760px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 3px 12px #0000000d}
h2{color:#087e6b}
h3{margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
a{color:#087e6b}
.item{padding:12px 0;border-bottom:1px solid #e2e8f0}
.small{font-size:13px;color:#64748b}
.answer{display:block;width:100%;margin:8px 0;text-align:left;background:#e0f2f1;color:#075e54}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>

<header>
<h1>💊 Mahder PharmaLearn</h1>
<p>Learn Pharmacology Anywhere</p>
<p>Student Learning Platform</p>
</header>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('drugs')">Drug Search</button>
<button onclick="show('books')">Books</button>
<button onclick="show('quiz')">Quiz</button>
<button onclick="show('about')">About</button>
</nav>

<main id="content"></main>

<footer>
Mahder PharmaLearn © 2026
<p>Educational use only. Not medical advice.</p>
</footer>

<script>
const drugs=[
{name:"Paracetamol",category:"Analgesic / Antipyretic",use:"Used to relieve mild to moderate pain and reduce fever.",warning:"Overdose can cause severe liver damage. Check combination medicines to avoid taking too much."},
{name:"Ibuprofen",category:"NSAID",use:"Used for pain, inflammation and fever.",warning:"May cause stomach bleeding and kidney problems. Some people with ulcers, kidney disease or pregnancy need medical advice before use."},
{name:"Amoxicillin",category:"Penicillin antibiotic",use:"An antibiotic used for certain bacterial infections.",warning:"Does not treat viral infections. Allergy to penicillin can cause serious reactions. Use only when prescribed."},
{name:"Metformin",category:"Antidiabetic",use:"Used to help manage type 2 diabetes.",warning:"Requires professional monitoring, especially kidney function. Rarely associated with lactic acidosis."},
{name:"Omeprazole",category:"Proton pump inhibitor",use:"Reduces stomach acid and is used for conditions such as acid reflux.",warning:"Long-term use should be reviewed by a healthcare professional."},
{name:"Cetirizine",category:"Antihistamine",use:"Used to relieve allergy symptoms such as sneezing and itching.",warning:"May cause drowsiness in some people. Avoid driving if affected."},
{name:"Amlodipine",category:"Calcium channel blocker",use:"Used to treat high blood pressure and some types of angina.",warning:"May cause ankle swelling or dizziness. Do not change treatment without professional advice."},
{name:"Salbutamol",category:"Bronchodilator",use:"Relieves breathing symptoms in conditions such as asthma.",warning:"Frequent need for relief medicine requires medical review. Follow the prescribed inhaler instructions."}
];

const books=[
{name:"Open RN Pharmacology",url:"https://wtcs.pressbooks.pub/pharmacology/"},
{name:"NCBI Bookshelf",url:"https://www.ncbi.nlm.nih.gov/books/"},
{name:"OpenStax Anatomy and Physiology",url:"https://openstax.org/details/books/anatomy-and-physiology-2e"},
{name:"WHO Publications",url:"https://www.who.int/publications"}
];

const questions=[
{q:"What is pharmacology?",a:["Study of drugs","Study of rocks","Study of stars","Study of weather"],c:0},
{q:"Which medicine is an antibiotic?",a:["Paracetamol","Amoxicillin","Omeprazole","Cetirizine"],c:1},
{q:"Which organ is especially at risk from paracetamol overdose?",a:["Heart","Liver","Lungs","Skin"],c:1},
{q:"What is the main action of omeprazole?",a:["Reduces stomach acid","Lowers blood sugar","Kills viruses","Relaxes muscles"],c:0},
{q:"Which medicine is used for type 2 diabetes?",a:["Metformin","Cetirizine","Ibuprofen","Salbutamol"],c:0}
];

let current=0,score=0,answered=false;

function show(page){
let c=document.getElementById("content");

if(page==="home"){
c.innerHTML=`
<div class="card">
<h2>Welcome Student! 👋</h2>
<p>Welcome to Mahder PharmaLearn.</p>
<p>Learn pharmacology, explore medicines and practice your knowledge.</p>
</div>
<div class="card">
<h2>📚 Learning Center</h2>
<p>Explore free educational resources.</p>
<button onclick="show('books')">Explore Books</button>
</div>
<div class="card">
<h2>💊 Drug Information</h2>
<p>Search basic educational information about medicines.</p>
<button onclick="show('drugs')">Search Drugs</button>
</div>
<div class="card">
<h2>📝 Knowledge Test</h2>
<p>Practice five pharmacology questions.</p>
<button onclick="show('quiz')">Start Quiz</button>
</div>`;
}

if(page==="drugs"){
c.innerHTML=`
<div class="card">
<h2>🔍 Drug Information Search</h2>
<input id="search" placeholder="Search medicine name..." oninput="searchDrug()">
<div id="results"></div>
</div>`;
searchDrug();
}

if(page==="books"){
c.innerHTML=`
<div class="card">
<h2>📚 Free Learning Resources</h2>
<p class="small">Open educational resources. Availability and download options depend on each publisher.</p>
${books.map(b=>`<div class="item"><h3>${b.name}</h3><a href="${b.url}" target="_blank" rel="noopener">Open Resource ↗</a></div>`).join("")}
</div>`;
}

if(page==="quiz"){
current=0;score=0;
quiz();
}

if(page==="about"){
c.innerHTML=`
<div class="card">
<h2>About Mahder PharmaLearn</h2>
<p>A learning platform for pharmacy students and pharmacology learners.</p>
<p>Our goal is to make pharmacy education accessible.</p>
<hr>
<h3>⚠️ Important Disclaimer</h3>
<p>This application is for educational purposes only. It is not a substitute for professional medical advice, diagnosis or treatment.</p>
<p>Always consult a qualified healthcare professional about medicines and treatment.</p>
</div>`;
}
}

function searchDrug(){
let q=(document.getElementById("search")?.value||"").toLowerCase();
let r=document.getElementById("results");
if(!r)return;
let found=drugs.filter(d=>(d.name+" "+d.category).toLowerCase().includes(q));
r.innerHTML=found.length?found.map(d=>`
<div class="item">
<h3>💊 ${d.name}</h3>
<p><b>Category:</b> ${d.category}</p>
<p><b>Uses:</b> ${d.use}</p>
<p><b>Safety:</b> ${d.warning}</p>
</div>`).join(""):"<p>No medicine found.</p>";
}

function quiz(){
let c=document.getElementById("content");
if(current>=questions.length){
c.innerHTML=`<div class="card"><h2>Quiz Completed 🎉</h2><h3>Your Score: ${score}/${questions.length}</h3><button onclick="show('quiz')">Try Again</button></div>`;
return;
}
let q=questions[current];
c.innerHTML=`
<div class="card">
<p class="small">Question ${current+1} of ${questions.length}</p>
<h2>📝 Pharmacology Quiz</h2>
<h3>${q.q}</h3>
${q.a.map((a,i)=>`<button class="answer" onclick="checkAnswer(${i})">${a}</button>`).join("")}
<p id="feedback"></p>
<button id="next" style="display:none" onclick="nextQuestion()">Next Question →</button>
</div>`;
answered=false;
}

function checkAnswer(i){
if(answered)return;
answered=true;
let q=questions[current];
let f=document.getElementById("feedback");
if(i===q.c){score++;f.innerHTML="Correct! 🎉";}
else{f.innerHTML="Incorrect. Correct answer: "+q.a[q.c];}
document.getElementById("next").style.display="block";
}

function nextQuestion(){current++;quiz();}

show("home");

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./service-worker.js")
.then(()=>console.log("Service worker registered"))
.catch(e=>console.log(e));
});
}
</script>
</body>
</html>
